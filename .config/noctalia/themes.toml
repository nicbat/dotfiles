# App palettes render automatically on wallpaper, palette, and light/dark changes.
[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[theme.templates.user.ghostty]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/ghostty"
output_path = "/home/nicbat/.config/ghostty/themes/noctalia"
post_hook = "/home/nicbat/.config/noctalia/hooks/template-apply.sh ghostty"

[theme.templates.user.kitty]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/kitty.conf"
output_path = "/home/nicbat/.config/kitty/themes/noctalia.conf"
post_hook = "/home/nicbat/.config/noctalia/hooks/template-apply.sh kitty"

[theme.templates.user.starship]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/starship.toml"
output_path = "/home/nicbat/.cache/noctalia/starship-palette.toml"
post_hook = "/home/nicbat/.config/noctalia/hooks/template-apply.sh starship"

[theme.templates.user.gtk_0]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/gtk_0.css"
output_path = "/home/nicbat/.config/gtk-3.0/noctalia.css"
index = 10

[theme.templates.user.gtk_1]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/gtk_1.css"
output_path = "/home/nicbat/.config/gtk-4.0/noctalia.css"
post_hook = "python3 /home/nicbat/.config/noctalia/hooks/gtk-refresh.py {{ mode }}"
index = 11
hook_async = false

[theme.templates.user.qt_0]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/qt_0.conf"
output_path = "/home/nicbat/.config/qt5ct/colors/noctalia.conf"

[theme.templates.user.qt_1]
