[theme.templates.user.zenBrowser_0]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/zenBrowser_0.css"
output_path = "/home/nicbat/.cache/noctalia/zen-browser/zen-userChrome.css"
index = 20

[theme.templates.user.zenBrowser_1]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/zenBrowser_1.css"
output_path = "/home/nicbat/.cache/noctalia/zen-browser/zen-userContent.css"
post_hook = "sh -c 'CSS_CHROME=\"$HOME/.cache/noctalia/zen-browser/zen-userChrome.css\"; CSS_CONTENT=\"$HOME/.cache/noctalia/zen-browser/zen-userContent.css\"; LINE_CHROME=\"@import \\\"$CSS_CHROME\\\";\"; LINE_CONTENT=\"@import \\\"$CSS_CONTENT\\\";\"; find \"$HOME/.config/zen\" \"$HOME/.zen\" -mindepth 2 -maxdepth 2 -type d -name chrome -print0 2>/dev/null | while IFS= read -r -d \"\" dir; do USER_CHROME=\"$dir/userChrome.css\"; USER_CONTENT=\"$dir/userContent.css\"; mkdir -p \"$dir\"; touch \"$USER_CHROME\" \"$USER_CONTENT\"; sed -i \"/zen-browser\\/zen-userChrome\\.css/d\" \"$USER_CHROME\"; sed -i \"/zen-browser\\/zen-userContent\\.css/d\" \"$USER_CONTENT\"; if ! grep -Fq \"$LINE_CHROME\" \"$USER_CHROME\"; then printf \"%s\\n\" \"$LINE_CHROME\" >> \"$USER_CHROME\"; fi; if ! grep -Fq \"$LINE_CONTENT\" \"$USER_CONTENT\"; then printf \"%s\\n\" \"$LINE_CONTENT\" >> \"$USER_CONTENT\"; fi; done'"
index = 21
hook_async = false

[theme.templates.user.yazi_0]
input_path = "/home/nicbat/.config/noctalia/templates/imported-v4/yazi_0.toml"
output_path = "/home/nicbat/.config/yazi/flavors/noctalia.yazi/flavor.toml"
