onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

agent_panel_sort = "spaces"
status_indicators = "symbols"
sidebar_width = 44
sidebar_min_width = 40
sidebar_max_width = 56

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", fg = "#cdd6f4", bold = true, dim = false }],
  [{ token = "$topic", fg = "#cdd6f4", dim = false }],
  [{ token = "$counts", fg = "#a6adc8", dim = false }],
  [{ token = "$activity", fg = "#f9e2af", dim = false }],
  [{ token = "$bg_activity", fg = "#f9e2af", dim = false }],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "pane", fg = "#cdd6f4", bold = true, dim = false }],
  [
    { token = "workspace", fg = "#a6adc8", bold = false, dim = false },
    { token = "agent", fg = "#a6adc8", dim = false },
    { token = "state_text", dim = false },
  ],
  [{ token = "$bg_activity", fg = "#f9e2af", dim = false }],
]

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
active_row_bg = "#313244"

[keys]
previous_agent = "prefix+up"
next_agent = "prefix+down"
last_pane = "prefix+backspace"

[[keys.command]]
key = "prefix+space"
type = "popup"                 # the only route with a real interactive TTY
command = "sh ~/.config/herdr/plugins/config/cowboyvang.which-key/launch.sh"
description = "which-key: show prefix bindings"
width = "78%"
height = "62%"
