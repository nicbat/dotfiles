// ~/.config/logid/logid.cfg  ->  symlinked to /etc/logid.cfg
// Logitech MX Master 3, tuned for Niri (Wayland).
// logid sends keys through uinput, so binds work regardless of compositor.
//
// Apply changes:  ./restart.sh    (in this folder)
// Full reference: README.md       (in this folder)

devices: (
{
    // Must match the name logid printed exactly. Verify with `sudo logid -v`.
    name: "Wireless Mouse MX Master 3";

    // ---- Wheel -------------------------------------------------------------
    // threshold: scroll speed (ticks/sec) at which the wheel flips to freespin.
    //            Lower = flips sooner. Default 50; 15 means "spin on a flick,
    //            ratchet on slow scroll".
    // torque:    resistance felt in freespin mode, 0-100.
    smartshift: {
        on: true;
        threshold: 15;
        torque: 40;
    };

    hiresscroll: {
        hires: true;      // 120 ticks/rev instead of 18
        invert: false;
        target: false;    // false = hand scrolling to libinput (normal scrolling,
                          //         momentum, per-app config all keep working)
                          // true  = logid captures scroll; requires up/down blocks
    };

    // ---- Pointer -----------------------------------------------------------
    // MX Master 3 range is 200-4000, steps of 50.
    dpi: 800;

    // ---- Buttons -----------------------------------------------------------
    // CIDs confirmed from `sudo logid -v` on this exact mouse:
    //   0x50  left click      - not remappable
    //   0x51  right click     - not remappable
    //   0x52  middle click    - remappable (left stock: paste / open-in-new-tab)
    //   0x53  thumb Back      - remappable  <- lower of the two thumb buttons
    //   0x56  thumb Forward   - remappable  <- upper of the two thumb buttons
    //   0xc3  gesture button  - remappable  (the big pad under the thumb rest)
    //   0xc4  top button      - remappable  (behind the scroll wheel)
    //   0xd7  virtual gesture - internal, do not bind
    //
    // A button only obeys this file once it appears here (that "diverts" it).
    // Anything NOT listed keeps its stock firmware behaviour.
    buttons: (
        // --- 0xc3: gesture button (big pad under the thumb rest) -------------
        // Click it, or hold-and-push in a direction.
        {
            cid: 0xc3;
            action = {
                type: "Gestures";
                gestures: (
                    // Plain click, no movement.
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_O"]; };  // niri overview
                    },
                    // Push left/right -> move focus between columns.
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFT"]; };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_RIGHT"]; };
                    },
                    // Push up/down -> workspaces (niri stacks these vertically).
                    {
                        direction: "Up";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEUP"]; };
                    },
                    {
                        direction: "Down";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEDOWN"]; };
                    }
                );
            };
        },

        // --- 0xc4: top button behind the wheel ------------------------------
        // Stock firmware uses this to toggle ratchet/freespin. Diverting it
        // means you must bind that yourself, which is what this does.
        {
            cid: 0xc4;
            action = {
                type: "ToggleSmartShift";
            };
        },

        // --- 0x53 / 0x56: the two thumb buttons below the thumbwheel --------
        // Sent as explicit Alt+Left / Alt+Right keypresses rather than mouse
        // back/forward, so apps that only listen for the keyboard shortcut
        // (some Electron apps, terminals, editors) also respond.
        {
            cid: 0x53;                                                   // Back
            action = { type: "Keypress"; keys: ["KEY_LEFTALT", "KEY_LEFT"]; };
        },
        {
            cid: 0x56;                                                   // Forward
            action = { type: "Keypress"; keys: ["KEY_LEFTALT", "KEY_RIGHT"]; };
        }

        // --- 0x52: middle click ---------------------------------------------
        // Deliberately absent, so it stays stock middle click. Paste-on-middle
        // and open-link-in-new-tab are worth more than another bind.
        // To repurpose it, uncomment (and add a comma to the block above):
        // {
        //     cid: 0x52;
        //     action = { type: "CycleDPI"; dpis: [800, 1600, 2400, 3200]; };
        // }
    );

    // ---- Thumbwheel (the ridged side scroll) -------------------------------
    // This wheel does NOT have a physical click. Nothing in logid gives it one.
    // The hardware does report a capacitive `tap`, plus `touch` and `proxy`,
    // but ALL THREE only fire when divert = true.
    //
    // divert: false -> the wheel stays plain horizontal scroll, handled by
    //                  libinput. Smooth, works everywhere, respects per-app
    //                  scroll settings. left/right/tap/touch/proxy are ignored.
    // divert: true  -> logid captures the wheel; you must then bind left/right
    //                  yourself or the wheel does nothing at all.
    thumbwheel: {
        divert: false;
        invert: false;

        // Everything below is inert while divert = false. Kept here with the
        // CORRECT syntax so it's ready to uncomment.
        //
        // NOTE: tap / touch / proxy take an action DIRECTLY. They are not
        // wrapped in `action = { ... }` the way buttons are. Wrapping them is
        // what caused the "SettingNotFoundException" warnings in logid -v.
        //
        // left:  { mode: "OnInterval"; interval: 50;
        //          action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEUP"]; }; };
        // right: { mode: "OnInterval"; interval: 50;
        //          action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEDOWN"]; }; };
        //
        // tap:   { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_W"]; };  // capacitive tap
        // touch: { type: "None"; };   // finger lands on / leaves the wheel
        // proxy: { type: "None"; };   // finger approaches without touching
    };
}
);
